<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>ImmoCRM Pro v10.1 — Scaglia · Piacenza</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><div style="padding:24px;font-family:sans-serif;background:#111;color:#c9a96e">ImmoCRM richiede JavaScript. Attivalo nel browser, oppure apri il file tramite GitHub Pages (non dalla pagina del codice su github.com).</div></noscript>
<div id="login-screen">
<div class="login-box">
<div class="login-header"><div class="login-logo">🏢</div><div class="login-title">ImmoCRM Pro</div><div class="login-subtitle">Scaglia Davide — Piacenza</div><div class="login-version">v10.1 · Real Estate Operating System</div></div>
<div id="login-form">
<div class="login-field"><label>Password</label><input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"></div>
<button class="login-btn" onclick="doLogin()">🔐 Accedi</button>
<div class="login-err" id="login-err"></div>
<div class="login-hint">💡 <b>Primo accesso:</b> password <code>successo</code>. Poi cambiala in Impostazioni → Sicurezza.</div>
</div>
<div id="setup-form" style="display:none">
<div class="setup-banner">⚙️ <strong>Primo accesso</strong> — crea le credenziali</div>
<div class="login-field"><label>Il tuo nome</label><input type="text" id="setup-nome" value="Scaglia Davide"></div>
<div class="login-field"><label>Password (min 4)</label><input type="password" id="setup-pass"></div>
<div class="login-field"><label>Conferma password</label><input type="password" id="setup-pass2"></div>
<div class="login-field"><label>Domanda di sicurezza</label><input type="text" id="setup-question"></div>
<div class="login-field"><label>Risposta segreta</label><input type="text" id="setup-answer"></div>
<button class="login-btn" onclick="doSetup()">✅ Crea Account</button>
<div class="login-err" id="setup-err"></div>
</div>
</div>
</div>
<div id="app-shell" style="display:none">
<aside id="sidebar">
<div class="sidebar-logo"><div class="logo-text"><h1>ImmoCRM</h1><span>Scaglia · Piacenza</span></div><button class="sidebar-toggle" onclick="toggleSidebar()">◀</button></div>
<nav id="nav"></nav>
<div class="sidebar-user"><div class="avatar" id="uav">SD</div><div id="user-info"><div id="uname" class="user-name">Scaglia Davide</div><div id="urole" class="user-role">Agente Immobiliare</div></div><button id="logout-btn" onclick="doLogout()">⏻</button></div>
</aside>
<div id="main">
<header id="topbar"><button id="hamburger" class="btn-ghost" onclick="document.getElementById('sidebar').classList.toggle('mobile-open')">☰</button><h2 id="page-title">Regia</h2><span id="topbar-date" class="topbar-meta"></span><span id="save-indicator" class="topbar-save">✓</span><button class="btn-ghost" onclick="openGlobalSearch()">🔍</button><button class="btn-gold" onclick="topAdd()">+ Aggiungi</button></header>
<div id="content" class="fade-up"></div>
</div>
</div>
<div id="toast-container"></div>
<div id="search-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeGlobalSearch()"><div class="search-modal" onclick="event.stopPropagation()"><div class="search-head"><input id="search-input" placeholder="Cerca…" oninput="runGlobalSearch(this.value)"><button onclick="closeGlobalSearch()">ESC</button></div><div id="search-results"></div></div></div>
<script src="app.js" defer></script>
</body>
</html>
